# ============================================================================
# LiteLLM Configuration for Puter AI Gateway
# ============================================================================
# 
# Formato de modelos: puter/<provider>/<model-id>
# Ejemplo: puter/openai/gpt-4o, puter/anthropic/claude-3-5-sonnet-20241022
#
# Uso:
#   export PUTER_API_KEY=your_key_here
#   litellm --config config.yaml
#
# ============================================================================

general_settings:
  master_key: "sk-1234"

litellm_settings:
  custom_provider_map:
    - {"provider": "puter", "custom_handler": litellm_puter.provider.puter_llm}
  modify_params: true
  drop_params: true

model_list:
  # Wildcard: permite usar cualquier modelo directamente
  - model_name: "*"
    litellm_params:
      model: "*"

  # Aliases para Claude
  - model_name: "claude*"
    litellm_params:
      model: "puter/anthropic/claude*"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "claude-sonnet-4-5"
    litellm_params:
      model: "puter/anthropic/claude-sonnet-4-5-20250929"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "claude-3-5-sonnet"
    litellm_params:
      model: "puter/anthropic/claude-3-5-sonnet-20241022"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "claude-3-opus"
    litellm_params:
      model: "puter/anthropic/claude-3-opus-20240229"
      api_key: "os.environ/PUTER_API_KEY"

  # Aliases para GPT
  - model_name: "gpt-4o"
    litellm_params:
      model: "puter/openai/gpt-4o"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "puter/openai/gpt-4o-mini"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "gpt-4-turbo"
    litellm_params:
      model: "puter/openai/gpt-4-turbo"
      api_key: "os.environ/PUTER_API_KEY"

  # DeepSeek
  - model_name: "deepseek-chat"
    litellm_params:
      model: "puter/deepseek/deepseek-chat"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "deepseek-coder"
    litellm_params:
      model: "puter/deepseek/deepseek-coder"
      api_key: "os.environ/PUTER_API_KEY"

  # xAI Grok
  - model_name: "grok-2"
    litellm_params:
      model: "puter/xai/grok-2-1212"
      api_key: "os.environ/PUTER_API_KEY"

  # Google Gemini
  - model_name: "gemini-2-flash"
    litellm_params:
      model: "puter/google/gemini-2.0-flash-exp"
      api_key: "os.environ/PUTER_API_KEY"

  - model_name: "gemini-1.5-pro"
    litellm_params:
      model: "puter/google/gemini-1.5-pro"
      api_key: "os.environ/PUTER_API_KEY"

  # Meta Llama
  - model_name: "llama-3.3-70b"
    litellm_params:
      model: "puter/meta-llama/llama-3.3-70b-instruct"
      api_key: "os.environ/PUTER_API_KEY"
