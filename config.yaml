# LiteLLM Configuration for Puter AI Gateway
# Format: model: puter/<provider>/<model-id>
#
# Priority providers: OpenAI, Anthropic, DeepSeek, xAI
#
# To use a model:
#   litellm.completion(model='puter/openai/gpt-4o', messages=[...])
#
general_settings:
  master_key: "sk-1234"

litellm_settings:
  custom_provider_map:
    - {"provider": "puter", "custom_handler": litellm_puter.puter_llm}
  modify_params: True

model_list:

  # ======================================================================
  # OpenAI Models (GPT) - 23 models
  # ======================================================================

  - model_name: "*"
    litellm_params:
      model: "*"

  - model_name: "claude*"
    litellm_params:
      model: "puter/anthropic/claude*"

  - model_name: "claude-sonnet-4-5"
    litellm_params:
      model: "puter/anthropic/claude-sonnet-4-5-20250929"

  - model_name: "claude-3-5-sonnet-20241022"
    litellm_params:
      model: "puter/anthropic/claude-3-5-sonnet-20241022"
