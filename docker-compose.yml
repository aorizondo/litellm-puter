services:
  litellm:
    build: .
    container_name: litellm_puter
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      # Configuración de LiteLLM
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm_db}

      # Xvfb y Chrome
      USE_XVFB: "1"
      DISPLAY: ":99"
      CHROME_BIN: /usr/bin/google-chrome-stable

      # Optimizaciones
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
      UVICORN_WORKERS: "2"

      # LiteLLM
      PUTER_API_KEY: ${PUTER_API_KEY}

      # PostgreSQL
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    volumes:
      # Solo configuración, sin cache pesado
      - ./config.yaml:/app/config.yaml

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

    # Límites estrictos para VPS con pocos recursos
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: docker.io/pgvector/pgvector:pg15
    container_name: litellm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-litellm_db}

      # Optimizaciones extremas para bajo consumo
      POSTGRES_SHARED_BUFFERS: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 128MB
      WORK_MEM: 4MB
      MAINTENANCE_WORK_MEM: 32MB

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización mínimo
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm_db}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: always

    # Límites aún más ajustados para PostgreSQL
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.15'

volumes:
  postgres_data:
    driver: local
    name: litellm_postgres_data
  litellm_logs:
    driver: local