version: '3.8'

services:
  # ==========================================================================
  # LiteLLM Proxy Service
  # ==========================================================================
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm_puter
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    
    environment:
      # Puter API Key (REQUERIDO)
      PUTER_API_KEY: ${PUTER_API_KEY:?PUTER_API_KEY is required}
      
      # LiteLLM Configuration
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm_password}@db:5432/${POSTGRES_DB:-litellm_db}
      
      # PostgreSQL Connection
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_password}
      POSTGRES_DB: ${POSTGRES_DB:-litellm_db}
      
      # Xvfb y Chrome (para scraper)
      USE_XVFB: "${USE_XVFB:-1}"
      DISPLAY: ":99"
      CHROME_BIN: /usr/bin/google-chrome-stable
      
      # Redis (opcional, para cache)
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      
      # Performance
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      PYTHONUNBUFFERED: "1"
      
    volumes:
      # Configuración (debe estar en el mismo directorio que litellm_puter/)
      - ./config.yaml:/app/config.yaml:ro
      - ./litellm_puter:/app/litellm_puter:ro
      # Logs persistentes
      - litellm_logs:/app/logs
      # Tokens del scraper
      - ./token.txt:/app/token.txt
      
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        
    restart: unless-stopped
    
    # Límites de recursos (ajustar según necesidades)
    deploy:
      resources:
        limits:
          memory: ${LITELLM_MEMORY_LIMIT:-512M}
          cpus: ${LITELLM_CPU_LIMIT:-0.5}
        reservations:
          memory: ${LITELLM_MEMORY_RESERVATION:-256M}
          cpus: ${LITELLM_CPU_RESERVATION:-0.25}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - litellm_network

  # ==========================================================================
  # PostgreSQL Database with pgvector
  # ==========================================================================
  db:
    image: pgvector/pgvector:pg15
    container_name: litellm_db
    
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_password}
      POSTGRES_DB: ${POSTGRES_DB:-litellm_db}
      
      # Optimizaciones para bajo consumo
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-64MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-128MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-4MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-50}
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm_db}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      
    restart: always
    
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-256M}
          cpus: ${POSTGRES_CPU_LIMIT:-0.3}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-128M}
          cpus: ${POSTGRES_CPU_RESERVATION:-0.15}
    
    networks:
      - litellm_network

  # ==========================================================================
  # Redis Cache (Opcional)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: litellm_redis
    
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-64mb} --maxmemory-policy allkeys-lru
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
      
    volumes:
      - redis_data:/data
      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-128M}
          cpus: ${REDIS_CPU_LIMIT:-0.2}
    
    networks:
      - litellm_network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
    driver: local
    name: litellm_postgres_data
    
  redis_data:
    driver: local
    name: litellm_redis_data
    
  litellm_logs:
    driver: local
    name: litellm_logs

# ==========================================================================
# Networks
# ==========================================================================
networks:
  litellm_network:
    driver: bridge
    name: litellm_network